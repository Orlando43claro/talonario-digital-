<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talonario Digital - Login</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    .login-container {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px;
        width: 90%;
        max-width: 400px;
        text-align: center;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
    }

    h1 {
        margin-bottom: 20px;
        font-size: 2em;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: none;
        border-radius: 8px;
        font-size: 1em;
    }

    input:focus {
        outline: 2px solid #4CAF50;
        background: rgba(255,255,255,0.9);
    }

    button {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 8px;
        font-size: 1em;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #45a049;
    }

    .error {
        color: #ff6b6b;
        margin-top: 10px;
        font-weight: bold;
    }

    .info-text {
        margin-top: 20px;
        font-size: 0.95em;
        color: #cde7ff;
        line-height: 1.5;
    }

    .whatsapp-link {
        color: #25D366;
        text-decoration: none;
        font-weight: 600;
    }

    .whatsapp-link:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        h1 {
            font-size: 1.6em;
        }
    }
</style>
</head>
<body>

<div class="login-container" id="loginContainer">
    <h1>Iniciar Sesión</h1>
    <input type="text" id="usuario" placeholder="Usuario">
    <input type="password" id="contrasena" placeholder="Contraseña">
    <button id="btnLogin">Ingresar</button>
    <div class="error" id="errorMsg"></div>

    <p class="info-text">
        Para ingresar, solicita tu <b>usuario y contraseña</b> por 
        <a class="whatsapp-link" href="https://wa.me/573155445183?text=Hola,%20quiero%20solicitar%20mi%20usuario%20y%20contraseña%20para%20acceder%20a%20Talonario%20Digital,%20o%20saber%20cuánto%20debo%20pagar%20para%20obtener%20acceso." target="_blank">
            WhatsApp al +57 315 5445183
        </a> 
        o consulta cuánto debes pagar para obtener acceso.
    </p>
</div>

<script>
    // Lista de usuarios válidos (puedes agregar más)
    const usuarios = {
        "orlando": "1234",
        "cliente1": "abcd",
        "cliente2": "xyz789",
        "admin": "admin123"
    };

    const loginContainer = document.getElementById("loginContainer");
    const errorMsg = document.getElementById("errorMsg");
    const btnLogin = document.getElementById("btnLogin");

    // Si ya inició sesión antes, redirigir directamente
    if (localStorage.getItem("usuarioLogueado")) {
        window.location.href = "go:rifa";
    }

    btnLogin.addEventListener("click", () => {
        const usuario = document.getElementById("usuario").value.trim();
        const contrasena = document.getElementById("contrasena").value.trim();

        if (usuarios[usuario] && usuarios[usuario] === contrasena) {
            // Guardar sesión
            localStorage.setItem("usuarioLogueado", usuario);
            window.location.href = "go:rifa";
        } else {
            errorMsg.textContent = "❌ Usuario o contraseña incorrectos";
        }
    });
</script>

</body>
</html>
