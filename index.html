<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Talonario Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" id="favicon" type="image/png" href="icono-talonariodigital.png">
    <style>
        /* Estilos Base */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.15); /* Efecto glassmorphism base */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
            box-sizing: border-box;
            font-size: 1em;
            color: #34495e;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        /* Estilo para el botón de Ingresar (Pago) */
        #btnLogin {
            background-color: #2ecc71;
            color: white;
        }

        #btnLogin:hover {
            background-color: #27ae60;
        }

        /* 🔥 NUEVO ESTILO: Botón de Demostración */
        #btnDemo {
            background-color: #3498db; 
            color: white;
            margin-top: 10px; 
        }

        #btnDemo:hover {
            background-color: #2980b9;
        }
        /* FIN NUEVO ESTILO */

        .error {
            color: #e74c3c;
            margin-top: 15px;
            font-weight: 600;
            display: none;
        }

        .whatsapp-link {
            color: #2c3e50;
            margin-top: 20px;
            display: block;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .whatsapp-link:hover {
            color: #2ecc71;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Talonario Digital</h1>
        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="contrasena" placeholder="Contraseña">
        
        <button id="btnLogin">Ingresar</button>
        
        <button id="btnDemo">Acceso de Demostración</button>
        
        <div class="error" id="errorMsg">Usuario o contraseña incorrectos.</div>
    </div>
    
    <a class="whatsapp-link" href="https://wa.me/573155445183?text=Hola,%20quiero%20solicitar%20mi%20usuario%20y%20contraseña%20para%20acceder%20a%20Talonario%20Digital,%20o%20saber%20cuánto%20debo%20pagar%20para%20obtener%20acceso." target="_blank">
        WhatsApp al +57 315 5445183
    </a>

        };

        const usuarioInput = document.getElementById("usuario");
        const contrasenaInput = document.getElementById("contrasena");
        const btnLogin = document.getElementById("btnLogin");
        const errorMsg = document.getElementById("errorMsg");
        
        // 🔥 NUEVA VARIABLE: Botón de Demostración
        const btnDemo = document.getElementById("btnDemo"); 

        // 1. Verificar si ya hay una sesión activa
        if (localStorage.getItem("usuarioLogueado")) {
            // Si ya hay sesión, ir directamente al talonario
            window.location.href = "talonario.html";
        }

        // 2. Función de LOGIN NORMAL (Pago)
        btnLogin.addEventListener("click", () => {
            const usuario = usuarioInput.value.toLowerCase();
            const contrasena = contrasenaInput.value;

            if (usuarios[usuario] && usuarios[usuario] === contrasena) {
                // Login exitoso: Guardar el nombre de usuario
                localStorage.setItem("usuarioLogueado", usuario);
                
                // Redirigir y reemplazar el historial para evitar volver atrás fácilmente
                history.replaceState(null, document.title, location.href);
                window.location.href = "talonario.html";
            } else {
                // Login fallido
                errorMsg.style.display = "block";
                setTimeout(() => {
                    errorMsg.style.display = "none";
                }, 3000);
            }
        });
        
        // 3. 🔥 FUNCIÓN DE ACCESO DEMOSTRACIÓN 🔥
        btnDemo.addEventListener("click", () => {
            // Se usa "demo_user" para distinguirlo de los usuarios de pago
            localStorage.setItem("usuarioLogueado", "demo_user"); 
            
            // Si quieres que los datos demo se borren al recargar la página:
            // localStorage.removeItem('numerosSeleccionados');
            // localStorage.removeItem('numerosPagados');
            // localStorage.setItem('datosBoletos', JSON.stringify({}));

            // Redirigir
            history.replaceState(null, document.title, location.href);
            window.location.href = "talonario.html";
        });
        // FIN FUNCIÓN DEMOSTRACIÓN

    </script>
</body>
</html>
