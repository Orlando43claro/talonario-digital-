<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talonario Digital - Login</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    .login-container {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px;
        width: 90%;
        max-width: 400px;
        text-align: center;
        backdrop-filter: blur(10px);
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.3);
    }

    h1 {
        margin-bottom: 20px;
        font-size: 2em;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: none;
        border-radius: 8px;
        font-size: 1em;
    }

    input:focus {
        outline: 2px solid #4CAF50;
        background: rgba(255,255,255,0.9);
    }

    button {
        background-color: #4CAF50;
        color: white;
        border: none;
        padding: 12px;
        width: 100%;
        border-radius: 8px;
        font-size: 1em;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #45a049;
    }

    .error {
        color: #ff6b6b;
        margin-top: 10px;
        font-weight: bold;
    }

    .info-text {
        margin-top: 20px;
        font-size: 0.95em;
        color: #cde7ff;
        line-height: 1.5;
    }

    .whatsapp-link {
        color: #25D366;
        text-decoration: none;
        font-weight: 600;
    }

    .whatsapp-link:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        h1 {
            font-size: 1.6em;
        }
    }
</style>
</head>
<body>

<div class="login-container" id="loginContainer">
